[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fruitfly-simulation"
version = "0.1.0"
description = "Reproducible MaleCNS connectome preprocessing and interactive anatomy explorer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.3,<3",
  "pyarrow>=21,<22",
  "scipy>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
fruitfly-blackjack-api = "fruitfly_blackjack.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["fruitfly_blackjack"]
